; The sources are those of the parent folder; only the build differs.
; Platforms and packages are kept apart from the S3 build (parent folder),
; whose platform installs other versions of packages with the same names.
[platformio]
src_dir = ../src
platforms_dir = ~/.platformio/c5/platforms
packages_dir = ~/.platformio/c5/packages
default_envs = c5_touch_lcd

; Waveshare ESP32-C5-Touch-LCD-2.8: the same web front end plus the sweep on
; its 240x320 touch screen. The XIAO ESP32-C5 connects to header J8
; (GPIO2 / GPIO3), see README. Open this folder (c5_touch_lcd) in VS Code.
[env:c5_touch_lcd]
; pioarduino 55.03.30-2 = Arduino-ESP32 3.3.0, the newest release that installs
; with the standard PlatformIO IDE. Later releases (55.03.32 and up) need the
; pioarduino IDE extension; with the standard one they stop with
; "MissingPackageManifestError".
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    links2004/WebSockets@2.6.1
build_flags =
    -DFPV_LCD=1
    ; Serial = the C5's built-in USB serial/JTAG (the board JSON leaves it undefined)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; WebSockets 2.6.1 (still in 2.7.x) calls NetworkClient::flush(), which
    ; Arduino-ESP32 3.x marks deprecated: no deprecation warnings for libraries...
    -Wno-deprecated-declarations
; ...but this project's own sources still get them (applied after build_flags).
build_src_flags =
    -Wdeprecated-declarations
