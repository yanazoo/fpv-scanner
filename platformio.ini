; XIAO ESP32-S3: Wi-Fi web front end for an ESP-SDR XIAO ESP32-C5 (UART link).
; The C5 runs the unmodified ESP-SDR firmware from the browser installer.
[env:xiao_esp32s3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
; Some USB ports drop the link when esptool raises the baud rate.
upload_speed = 115200
lib_deps =
    links2004/WebSockets@2.4.1
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1

; Waveshare ESP32-C5-Touch-LCD-2.8: the same web front end plus the sweep on
; its 240x320 touch screen. The XIAO ESP32-C5 connects to header J8
; (GPIO2 / GPIO3), see README.
[env:c5_touch_lcd]
; pioarduino 55.03.30-2 = Arduino-ESP32 3.3.0, the newest release that installs
; with the standard PlatformIO IDE. Later releases (55.03.32 and up) need the
; pioarduino IDE extension; with the standard one they stop with
; "MissingPackageManifestError".
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    links2004/WebSockets@2.6.1
build_flags =
    -DFPV_LCD=1
    -DARDUINO_USB_CDC_ON_BOOT=1
