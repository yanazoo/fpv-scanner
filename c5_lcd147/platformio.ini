; The sources are those of the parent folder; only the build differs.
; Platforms and packages are kept apart from the S3 build (parent folder),
; whose platform installs other versions of packages with the same names.
[platformio]
src_dir = ../src
platforms_dir = ~/.platformio/c5/platforms
packages_dir = ~/.platformio/c5/packages
default_envs = c5_lcd147

; ESP32-C5-LCD-1.47 (KLAYERS / Waveshare): the same web front end plus the
; sweep on its 320x172 screen (landscape, no touch). The XIAO ESP32-C5
; connects to header pins "0" / "1" (GPIO0 / GPIO1), see README. Open this
; folder (c5_lcd147) in VS Code. Shares the platform and packages with
; c5_touch_lcd (~/.platformio/c5).
[env:c5_lcd147]
; pioarduino 55.03.30-2 = Arduino-ESP32 3.3.0, the newest release that installs
; with the standard PlatformIO IDE. Later releases (55.03.32 and up) need the
; pioarduino IDE extension; with the standard one they stop with
; "MissingPackageManifestError".
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino
monitor_speed = 115200
; The upload stopped at "Changing baud rate to 460800": stay at 115200 (as
; the S3 build does).
upload_speed = 115200
; With the stub flasher (esptool's default) the whole upload takes a few
; seconds. Without it (--no-stub, the ROM loader) it took over 20 s and was
; cut off about 20 s in every time. If the stub stops with "Write timeout",
; enable this line again:
; upload_flags = --no-stub
; The C5's built-in USB serial port passes the monitor's DTR/RTS lines to the
; chip's reset and boot pins: with the monitor open, pressing RESET could
; leave it in the download mode (screen dark until USB was replugged).
monitor_dtr = 0
monitor_rts = 0
board_build.partitions = huge_app.csv
; keeps the shared esptool at this platform's version (5.0.2), see the script
extra_scripts = pre:../tools/pin_esptool.py
lib_deps =
    links2004/WebSockets@2.6.1
build_flags =
    -DWEBSOCKETS_TCP_TIMEOUT=1000
    -DFPV_LCD=1
    -DFPV_LCD147=1
    ; Serial = the C5's built-in USB serial/JTAG (the board JSON leaves it undefined)
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; WebSockets 2.6.1 (still in 2.7.x) calls NetworkClient::flush(), which
    ; Arduino-ESP32 3.x marks deprecated: no deprecation warnings for libraries...
    -Wno-deprecated-declarations
; ...but this project's own sources still get them (applied after build_flags).
build_src_flags =
    -Wdeprecated-declarations
